<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipmVisiteurs – Installation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin: 0 auto 20px;
            background: #00794C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        h1 { font-size: 26px; color: #1d1d1f; margin-bottom: 8px; }
        .version { font-size: 14px; color: #86868b; margin-bottom: 28px; }
        .install-btn {
            display: inline-block;
            background: #00794C;
            color: white;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0,121,76,0.3);
        }
        .note {
            font-size: 13px;
            color: #86868b;
            line-height: 1.5;
            margin-top: 20px;
        }
        .warning {
            background: #fff3cd;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #856404;
            margin-top: 16px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">👥</div>
        <h1>PipmVisiteurs</h1>
        <p class="version">Version 1.0 – Application interne PIPM</p>

        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://david-gilet.github.io/pipm-visiteurs-deploy/manifest.plist">
            📲 Installer l'application
        </a>

        <div class="warning">
            ⚠️ Réservé aux appareils enregistrés. Ne pas diffuser ce lien.
        </div>

        <p class="note">
            Après l'installation, allez dans<br>
            <strong>Réglages → Général → VPN et gestion des appareils</strong><br>
            et faites confiance au profil développeur.
        </p>
    </div>
</body>
</html>
